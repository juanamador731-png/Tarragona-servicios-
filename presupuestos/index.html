<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18202a">
<title>Presupuestos Fácil V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#18202a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}
header p{margin:3px 0 0;opacity:.72;font-size:13px}
main{max-width:900px;margin:auto;padding:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tabs button,.btn{border:0;border-radius:11px;padding:12px;font-weight:700;cursor:pointer;background:#e6eaee;color:#17202a}
.tabs button.active,.primary{background:#18202a;color:white}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d7dce1;border-radius:10px;font:inherit}
textarea{min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.actions .wide{grid-column:1/-1}
.total{text-align:right;font-size:25px;font-weight:800;margin-top:12px}
.muted{font-size:13px;color:#68727d}
.hidden{display:none!important}
.item{border:1px solid #e1e5e9;border-radius:12px;padding:12px;margin-top:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item strong{display:block}
.item small{color:#68727d}
.empty{text-align:center;padding:30px 10px;color:#68727d}
.preview{border:1px solid #ddd;border-radius:12px;padding:20px;background:white}
.right{text-align:right}
@media(max-width:600px){
.grid,.actions{grid-template-columns:1fr}
.tabs{position:sticky;top:76px;z-index:4}
.actions .wide{grid-column:auto}
}
@media print{
header,.tabs,form,.actions,#listSection{display:none!important}
body{background:#fff}
.card{box-shadow:none}
}
</style>
</head>
<body>

<header>
<h1>Presupuestos Fácil</h1>
<p>V2 · Clientes · Presupuestos · Historial</p>
</header>

<main>

<div class="tabs">
<button id="tabNew" class="active" onclick="showTab('new')">Nuevo</button>
<button id="tabHistory" onclick="showTab('history')">Historial</button>
<button id="tabBusiness" onclick="showTab('business')">Mi negocio</button>
</div>

<section id="new">

<form id="quoteForm" class="card">
<h2>Nuevo presupuesto</h2>

<div class="grid">
<div>
<label>Cliente</label>
<input id="client" required placeholder="Nombre del cliente">
</div>

<div>
<label>Fecha</label>
<input id="date" type="date">
</div>
</div>

<label>Trabajo / servicio</label>
<textarea id="description" placeholder="Ej.: Limpieza de vivienda completa"></textarea>

<div class="grid">
<div>
<label>Precio sin IVA (€)</label>
<input id="price" type="number" step="0.01" min="0" value="0">
</div>

<div>
<label>IVA (%)</label>
<input id="tax" type="number" step="0.1" value="21">
</div>
</div>

<div class="total" id="total">0,00 €</div>

<div class="actions">
<button type="button" class="primary" onclick="saveQuote()">Guardar presupuesto</button>
<button type="button" onclick="previewQuote()">Vista previa</button>
</div>
</form>

<div id="previewCard" class="card hidden">
<h2>Vista previa</h2>
<div id="preview" class="preview"></div>

<div class="actions">
<button class="primary" onclick="window.print()">Imprimir / PDF</button>
<button onclick="shareWhatsApp()">Enviar por WhatsApp</button>
</div>
</div>

</section>

<section id="history" class="hidden">

<div class="card" id="listSection">
<h2>Historial</h2>
<div id="list"></div>
</div>

<div id="historyPreview" class="card hidden">
<h2>Presupuesto</h2>
<div id="historyPreviewBody" class="preview"></div>

<div class="actions">
<button class="primary" onclick="window.print()">Imprimir / PDF</button>
<button onclick="shareWhatsApp()">WhatsApp</button>
</div>
</div>

</section>

<section id="business" class="hidden">

<div class="card">
<h2>Mi negocio</h2>

<label>Nombre</label>
<input id="bizName" placeholder="Nombre de tu negocio">

<label>Teléfono</label>
<input id="bizPhone" placeholder="600 000 000">

<label>Email</label>
<input id="bizEmail" placeholder="correo@ejemplo.com">

<label>Dirección</label>
<input id="bizAddress" placeholder="Dirección">

<button class="primary" onclick="saveBusiness()">Guardar datos</button>

<p class="muted">
Los datos se guardan solamente en este dispositivo en esta versión de prueba.
</p>

</div>

</section>

</main>

<script>

let currentQuote=null;

const $=id=>document.getElementById(id);

$("date").value=new Date().toISOString().slice(0,10);

$("price").addEventListener("input",calc);
$("tax").addEventListener("input",calc);

function calc(){

let p=+$("price").value||0;
let t=+$("tax").value||0;

$("total").textContent=
(p+p*t/100).toLocaleString("es-ES",{
style:"currency",
currency:"EUR"
});

}

function business(){

return JSON.parse(
localStorage.getItem("business")||"{}"
);

}

function saveBusiness(){

localStorage.setItem(
"business",
JSON.stringify({
name:$("bizName").value,
phone:$("bizPhone").value,
email:$("bizEmail").value,
address:$("bizAddress").value
})
);

alert("Datos guardados.");

}

function loadBusiness(){

let b=business();

$("bizName").value=b.name||"";
$("bizPhone").value=b.phone||"";
$("bizEmail").value=b.email||"";
$("bizAddress").value=b.address||"";

}

function quoteData(){

let p=+$("price").value||0;
let t=+$("tax").value||0;

return {

id:Date.now(),

client:$("client").value.trim(),

date:$("date").value,

description:$("description").value.trim(),

price:p,

tax:t,

iva:p*t/100,

total:p+p*t/100

};

}

function render(q){

let b=business();

currentQuote=q;

return `

<h2 style="margin:0 0 3px">
${esc(b.name||"Mi negocio")}
</h2>

<div class="muted">
${esc(b.phone||"")}
${b.email?" · "+esc(b.email):""}
</div>

<hr>

<p>
<b>Presupuesto</b> · ${esc(q.date)}
<br>
<b>Cliente:</b> ${esc(q.client)}
</p>

<h3>Servicio</h3>

<p style="white-space:pre-wrap">
${esc(q.description||"Servicio")}
</p>

<div class="right">

<p>
Base imponible: ${q.price.toFixed(2)} €
</p>

<p>
IVA (${q.tax}%): ${q.iva.toFixed(2)} €
</p>

<div class="total">
Total: ${q.total.toFixed(2)} €
</div>

</div>

`;

}

function previewQuote(){

let q=quoteData();

currentQuote=q;

$("preview").innerHTML=render(q);

$("previewCard").classList.remove("hidden");

}

function saveQuote(){

let q=quoteData();

if(!q.client){

alert("Escribe el nombre del cliente.");

return;

}

let arr=JSON.parse(
localStorage.getItem("quotes")||"[]"
);

arr.unshift(q);

localStorage.setItem(
"quotes",
JSON.stringify(arr)
);

currentQuote=q;

$("preview").innerHTML=render(q);

$("previewCard").classList.remove("hidden");

alert("Presupuesto guardado.");

}

function loadList(){

let arr=JSON.parse(
localStorage.getItem("quotes")||"[]"
);

let box=$("list");

if(!arr.length){

box.innerHTML=
'<div class="empty">Todavía no hay presupuestos guardados.</div>';

return;

}

box.innerHTML=arr.map(q=>`

<div class="item">

<div>

<strong>
${esc(q.client)}
</strong>

<small>
${esc(q.description||"Servicio")}
 · ${q.total.toFixed(2)} €
</small>

</div>

<button onclick="openQuote(${q.id})">
Abrir
</button>

</div>

`).join("");

}

function openQuote(id){

let arr=JSON.parse(
localStorage.getItem("quotes")||"[]"
);

let q=arr.find(x=>x.id===id);

if(!q)return;

currentQuote=q;

$("historyPreviewBody").innerHTML=render(q);

$("historyPreview").classList.remove("hidden");

}

function shareWhatsApp(){

if(!currentQuote){

alert("Genera o abre un presupuesto primero.");

return;

}

let b=business();

let txt=
`Hola ${currentQuote.client}, te envío el presupuesto de ${b.name||"nuestro servicio"}. Total: ${currentQuote.total.toFixed(2)} €. Descripción: ${currentQuote.description||"Servicio"}.`;

window.open(
"https://wa.me/?text="+encodeURIComponent(txt),
"_blank"
);

}

function showTab(t){

["new","history","business"]
.forEach(x=>
$(x).classList.toggle("hidden",x!==t)
);

["tabNew","tabHistory","tabBusiness"]
.forEach(x=>
$(x).classList.remove("active")
);

$("tab"+
t.charAt(0).toUpperCase()+
t.slice(1)
).classList.add("active");

if(t==="history")
loadList();

if(t==="business")
loadBusiness();

}

function esc(s){

return String(s||"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}

calc();

loadBusiness();

</script>

</body>
</html>
